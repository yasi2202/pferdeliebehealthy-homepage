<style>
  :root {
    --bg: #F9EDED;
    --main: #DFA9A9;
    --dark: #B87878;
    --text: #4A3636;
    --line: #EAD8D8;
    --linelight: #E3D0D0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg);
    font-family: Georgia, "DejaVu Serif", serif;
    color: var(--text);
  }
  #app {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .banner {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    /* 52 statt 30 Prozent: bei einem 220 Pixel hohen Streifen aus einem
       Hochformat bleibt nur ein schmales Band uebrig. Bei 30 Prozent war das
       Helenas angeschnittener Kopf, bei 52 Prozent sind Yasis Gesicht und
       Helenas Nuestern zu sehen. */
    object-position: center 52%;
    display: block;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 40px 16px;
  }
  .center { text-align: center; }
  .col { display: flex; flex-direction: column; }
  .gap-7 { gap: 28px; }
  .gap-6 { gap: 24px; }
  .gap-5 { gap: 20px; }
  .gap-4 { gap: 16px; }
  .gap-3 { gap: 12px; }
  .gap-2 { gap: 8px; }
  .items-center { align-items: center; }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--dark);
    flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .kicker {
    color: var(--dark);
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
  }
  .subkicker {
    color: var(--dark);
    font-size: 0.7rem;
    letter-spacing: 1px;
    opacity: 0.65;
    margin: -4px 0 0 0;
  }
  h1 {
    color: var(--dark);
    font-size: 1.9rem;
    line-height: 1.35;
    font-weight: 400;
    margin: 0;
  }
  h2.qtitle {
    color: var(--dark);
    font-size: 1.35rem;
    line-height: 1.45;
    font-weight: 400;
    margin: 0;
  }
  p { line-height: 1.7; margin: 0; }
  .lead { opacity: 0.9; }
  .signature {
    color: var(--dark);
    opacity: 0.6;
    font-size: 0.85rem;
    line-height: 1.6;
    font-style: italic;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    width: 100%;
    padding: 16px;
    border-radius: 6px;
    background: var(--dark);
    color: white;
    font-size: 1rem;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 14px rgba(184,120,120,0.25);
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.35; cursor: default; }
  .btn-secondary {
    padding: 12px 20px;
    border-radius: 6px;
    background: transparent;
    color: var(--dark);
    border: 1px solid var(--linelight);
  }
  .row { display: flex; gap: 12px; }
  .flex-1 { flex: 1; }
  .progress-label {
    color: var(--dark);
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 8px;
  }
  .progress-track {
    width: 100%;
    height: 3px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--dark);
    transition: width 0.3s;
  }
  .hint { color: var(--text); opacity: 0.6; font-size: 0.85rem; margin-top: 6px; }
  .option {
    width: 100%;
    text-align: left;
    padding: 16px 20px;
    border-radius: 6px;
    border: 1px solid var(--linelight);
    background: white;
    color: var(--text);
    box-shadow: 0 1px 2px rgba(74,54,54,0.04);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1rem;
    transition: background 0.15s, border-color 0.15s;
  }
  .option.selected {
    border-color: var(--dark);
    background: #F3E4E4;
    color: var(--dark);
    box-shadow: none;
  }
  .dash { color: var(--dark); font-size: 0.9rem; }
  .card {
    border-radius: 10px;
    padding: 28px;
    background: white;
    border: 1px solid var(--main);
    box-shadow: 0 2px 16px rgba(74,54,54,0.06);
  }
  .card-cta {
    border-radius: 10px;
    padding: 28px;
    background: var(--dark);
    text-align: center;
  }
  .result-kicker {
    color: var(--dark);
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
    margin: 0;
  }
  .result-title {
    color: var(--dark);
    font-size: 1.6rem;
    font-weight: 400;
    margin: 4px 0 0 0;
  }
  .result-rule {
    width: 36px; height: 2px;
    background: var(--main);
    margin-top: 8px;
  }
  .callout {
    border-radius: 6px;
    padding: 16px;
    background: var(--bg);
    border-left: 2px solid var(--dark);
    font-size: 0.95rem;
  }
  .alter-note {
    opacity: 0.85;
    font-size: 0.95rem;
  }
  .cta-text { color: white; opacity: 0.95; }
  .cta-btn {
    width: 100%;
    padding: 16px;
    border-radius: 6px;
    background: white;
    color: var(--dark);
    font-size: 1rem;
    letter-spacing: 0.5px;
    text-decoration: none;
    display: inline-block;
    text-align: center;
    transition: opacity 0.15s;
  }
  .cta-btn:hover { opacity: 0.9; }
  .restart-link {
    background: none;
    color: var(--dark);
    opacity: 0.55;
    font-size: 0.85rem;
    border-bottom: 1px solid var(--dark);
    align-self: center;
    padding: 0;
  }
  .restart-link:hover { opacity: 0.8; }
  .feld { display: flex; flex-direction: column; gap: 6px; }
  .feld label {
    font-size: 0.8rem;
    color: var(--dark);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .feld input {
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    padding: 14px;
    border-radius: 6px;
    border: 1px solid var(--linelight);
    background: white;
    width: 100%;
  }
  .feld input:focus {
    outline: 2px solid var(--main);
    outline-offset: 1px;
  }
  .zustimmung {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 0.85rem;
    line-height: 1.6;
    opacity: 0.85;
    cursor: pointer;
  }
  .zustimmung input {
    margin: 3px 0 0 0;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: var(--dark);
    cursor: pointer;
  }
  .zustimmung a { color: var(--dark); }
  .fehler {
    color: #9c3b3b;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .kleingedrucktes {
    font-size: 0.78rem;
    line-height: 1.6;
    opacity: 0.6;
  }
  /* Der Honigtopf gegen Spam-Skripte: fuer Menschen unsichtbar, fuer
     automatische Ausfueller nicht. Wer ihn ausfuellt, wird aussortiert. */
  .honigtopf {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
</style>

      return `Bei deinem Pferd kommen aktuell mehrere Futterkomponenten zusammen, ohne dass ein klarer roter Faden erkennbar ist. Genau das begegnet mir in der Beratung immer wieder, viele einzelne Zus\ätze und Bausteine nebeneinander, und trotzdem bleibt die eigentliche Grundversorgung l\ückenhaft, weil niemand mehr den vollst\ändigen \Überblick hat, was sich wo erg\änzt oder sogar \überschneidet. Besonders bei Spurenelementen wie Zink, Kupfer und Selen kann das zum Problem werden, denn hier stehen sich einzelne Mineralstoffe bei zu hoher Dosierung gegenseitig im Weg und blockieren sich in der Aufnahme, statt sich zu erg\änzen. ${symptomText}`;
    },
    step: "Der erste Schritt ist deshalb nicht, noch etwas hinzuzuf\ügen, sondern einmal in Ruhe zu verstehen, was dein Pferd \über Heu und Grundfutter bereits bekommt und was davon tats\ächlich fehlt. Genau diese Klarheit schaffst du dir im Mineralfinder Kurs.",
  },
  mineral_blindflug: {
    title: "Mineral-Blindflug",
    kicker: "Dein F\ütterungstyp",
    text: (a) => {
      const grund =
        a.grundfuetterung === "nur_heu"
          ? "Heu"
          : "Heu und dein Grundfutter";
      return `Deine Grundf\ütterung ist \überschaubar und solide aufgebaut, ${grund} bildet eine gute Basis f\ür dein Pferd. Was aktuell fehlt oder unklar ist, ist die Mineralversorgung. Weil dein Pferd kein oder nur unregelm\ä\ßig Mineralfutter bekommt, f\ütterst du an dieser Stelle im Grunde auf gut Gl\ück, denn Heu allein deckt vor allem den Bedarf an Spurenelementen wie Zink, Kupfer und Selen so gut wie nie zuverl\ässig, ganz unabh\ängig von der Qualit\ät und selbst bei sehr gutem Heu schwankt der Mineralgehalt je nach Region und Boden erheblich. Ganzheitlich betrachtet ist das genau die Stelle, die am meisten Einfluss auf das Gesamtbild deines Pferdes hat, auch wenn sie sich selten sofort zeigt, sondern erst \über Monate hinweg, am Fell, an den Hufen oder an der allgemeinen Verfassung.`;
    },
    step: "Der naheliegendste n\ächste Schritt ist, die Mineralversorgung deines Pferdes einmal wirklich zu verstehen, statt sie zu sch\ätzen. Genau darum geht es im Mineralfinder Kurs.",
  },
  symptom_feuerwehr: {
    title: "Symptom-Feuerwehr",
    kicker: "Dein F\ütterungstyp",
    text: (a) => {
      const symptome = a.aﾮlligkeiten.filter((s) => s !== "keine");
      const symptomListe =
        symptome.length > 0
          ? symptome.map((s) => LABELS[s]).join(", ")
          : "die aktuellen Auff\älligkeiten";
      return `Bei deinem Pferd zeigen sich bereits konkrete Anzeichen, zum Beispiel ${symptomListe}. Das ist der Moment, in dem die meisten beginnen zu reagieren statt vorzubeugen, hier ein Zusatzfutter, dort ein Mittel, immer dem aktuellen Symptom hinterher. Aus meiner Erfahrung liegt hinter Symptomen wie Kotwasser fast immer eine Rohfaser- oder Darmflorafrage, hinter Fellproblemen oder einem z\ähen Fellwechsel h\äufig ein Mangel an Zink, Kupfer oder Biotin, hinter Juckreiz und Ekzem oft ein Ungleichgewicht bei den Fetts\äuren, und hinter Hufproblemen, Atemwegsthemen oder ersten Stoffwechselauff\älligkeiten meistens eine tiefer liegende Baustelle im Mineralhaushalt. Ganzheitlich betrachtet hilft es deinem Pferd wenig, immer nur das aktuelle Symptom zu behandeln, solange die Ursache dahinter nicht angeschaut wird, kommt das n\ächste Symptom \über kurz oder lang wieder.`;
    },
    step: "Der wichtigste n\ächste Schritt ist deshalb, einmal von der Ursache aus zu denken statt vom Symptom. Wie das f\ür dein Pferd konkret aussehen kann, lernst du im Mineralfinder Kurs.",
  },
  auf_gutem_weg: {
    title: "Auf gutem Weg",
    kicker: "Dein F\ütterungstyp",
    text: (a) => {
      return `Bei deinem Pferd stimmt die Grundstruktur bereits, eine durchdachte F\ütterung, ein regelm\ä\ßiges Mineralfutter und aktuell keine gro\ßen Auff\älligkeiten. Das ist keine Selbstverst\ändlichkeit, den meisten Pferdebesitzern fehlt genau das. Was jetzt noch den Unterschied macht, sind die Feinheiten, ob die Mineralversorgung ganzheitlich und individuell wirklich zu Alter, Haltung und Belastung deines Pferdes passt, oder ob sie eher pauschal gew\ählt ist. Selbst ein gutes Standard-Mineralfutter deckt selten exakt das, was dein Pferd in seiner konkreten Lebensphase braucht.`;
    },
    step: "Der n\ächste sinnvolle Schritt ist nicht, alles umzuwerfen, sondern die Feinjustierung vorzunehmen. Genau da setzt der Mineralfinder Kurs an.",
  },
};

function altersHinweis(alter) {
  if (alter === "senior") {
    return "Bei Pferden in diesem hohen Alter lohnt sich ein noch genauerer Blick auf PPID und EMS, denn ein Stoffwechsel im Ungleichgewicht ver\ändert den Mineralstoffbedarf hier besonders deutlich, das habe ich bei meiner eigenen Stute Helena selbst erlebt.";
  }
  if (alter === "alt") {
    return "Bei Pferden in diesem Alter lohnt sich zus\ätzlich ein Blick auf die Themen PPID und EMS, denn ein Stoffwechsel im Ungleichgewicht ver\ändert auch den Mineralstoffbedarf sp\ürbar, das habe ich bei meiner eigenen Stute Helena selbst erlebt.";
  }
  if (alter === "fohlen_jung") {
    return "In diesem Alter steckt dein Pferd noch mitten im Wachstum, Knochen, Gelenke und Muskulatur entwickeln sich hier besonders intensiv, entsprechend hoch ist der Mineralstoffbedarf in dieser Phase.";
  }
  if (alter === "jung") {
    return "Bei j\üngeren Pferden bis zehn Jahren spielt zus\ätzlich das Wachstum beziehungsweise der Aufbau von Muskulatur und Knochenstruktur eine Rolle, der Mineralstoffbedarf ist hier oft h\öher als viele denken.";
  }
  return null;
}

function computeResult(a) {
  const score = {
    durcheinander: 0,
    mineral_blindflug: 0,
    symptom_feuerwehr: 0,
    auf_gutem_weg: 0,
  };

  switch (a.grundfuetterung) {
    case "nur_heu":
      break;
    case "heu_grundfutter":
      score.auf_gutem_weg += 1;
      break;
    case "heu_grundfutter_kraeuter":
      score.auf_gutem_weg += 1;
      break;
    case "heu_grundfutter_zusaetze":
      score.durcheinander += 1;
      break;
    case "nur_zusaetze":
      score.durcheinander += 2;
      break;
  }

  switch (a.mineralstatus) {
    case "kein_mineral":
      score.mineral_blindflug += 2;
      break;
    case "regelmaessig":
      score.auf_gutem_weg += 2;
      break;
    case "unregelmaessig":
      score.durcheinander += 2;
      score.mineral_blindflug += 1;
      break;
  }

  const symptome = a.aﾮlligkeiten.filter((s) => s !== "keine");
  if (symptome.length === 0) {
    score.auf_gutem_weg += 2;
  } else {
    score.symptom_feuerwehr += Math.min(symptome.length, 3);
    if (symptome.includes("stoffwechsel")) {
      score.symptom_feuerwehr += 1;
    }
  }

  switch (a.selbstbild) {
    case "passt":
      score.durcheinander += 2;
      score.symptom_feuerwehr += 1;
      break;
    case "durchdacht":
      score.auf_gutem_weg += 2;
      break;
  }

  const order = ["durcheinander", "mineral_blindflug", "symptom_feuerwehr", "auf_gutem_weg"];
  let best = order[0];
  for (const key of order) {
    if (score[key] > score[best]) best = key;
  }
  return best;
}

// ---- State ----
let state = {
  stage: "start",
  step: 0,
  answers: {
    alter: null,
    grundfuetterung: null,
    mineralstatus: null,
    aﾮlligkeiten: [],
    selbstbild: null,
  },
};

// Alles, was im E-Mail-Schritt eingetragen wird. Steht bewusst neben
// state.answers und nicht darin, damit die Auswertungslogik unberuehrt bleibt.
var kontakt = {
  vorname: "",
  email: "",
  einwilligung: false,
  laeuft: false,
  fehler: "",
};

function isAnswered(q) {
  if (q.multi) return state.answers[q.id].length > 0;
  return state.answers[q.id] !== null;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (state.stage === "start") {
    const banner = document.createElement("img");
    banner.className = "banner";
    banner.src = BANNER_IMG;
    banner.alt = "Pferdeliebehealthy";
    app.appendChild(banner);
  }

  const wrap = document.createElement("div");
  wrap.className = "wrap";
  app.appendChild(wrap);

  const inner = document.createElement("div");
  inner.style.maxWidth = "480px";
  inner.style.width = "100%";
  wrap.appendChild(inner);

  if (state.stage === "start") renderStart(inner);
  else if (state.stage === "quiz") renderQuiz(inner);
  else if (state.stage === "email") renderEmail(inner);
  else if (state.stage === "result") renderResult(inner);
}

function renderStart(container) {
  container.innerHTML = `
    <div class="col center gap-7" style="align-items:center;">
      <div class="avatar"><img src="${AVATAR_IMG}" alt="Yasi"></div>
      <div class="col gap-2">
        <p class="kicker">Yasi &middot; Pferdeliebehealthy</p>
        <p class="subkicker">Ern\ährungsberaterin f\ür Pferde</p>
        <h1>Der Futter-Check</h1>
      </div>
      <p class="lead">
        In f\ünf kurzen Fragen bekommst du eine erste ehrliche
        Einsch\ätzung, ob die aktuelle F\ütterung deines Pferdes
        ganzheitlich betrachtet wirklich zu seiner Situation passt,
        oder ob sie das eigentliche Problem eher noch mitträgt. Kein
        R\ätselraten, sondern ein erster klarer Blick auf das gro\ße
        Ganze, statt nur auf ein einzelnes Symptom. Dauer unter drei
        Minuten.
      </p>
      <button class="btn-primary" id="start-btn">Jetzt starten</button>
      <p class="signature">
        Diesen Blick auf die F\ütterung habe ich mir selbst erarbeitet,
        als meine Stute Helena mit Cushing kurz vorm Einschl\äfern
        stand und ich sie \über die richtige F\ütterung wieder
        aufgebaut habe.
      </p>
    </div>
  `;
  container.querySelector("#start-btn").addEventListener("click", () => {
    state.stage = "quiz";
    state.step = 0;
    render();
  });
}

function renderQuiz(container) {
  const q = QUESTIONS[state.step];
  const total = QUESTIONS.length;
  const pct = ((state.step + 1) / total) * 100;

  const div = document.createElement("div");
  div.className = "col gap-7";

  div.innerHTML = `
    <div>
      <div class="progress-label">Frage ${state.step + 1} von ${total}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div>
      <h2 class="qtitle">${esc(q.text)}</h2>
      ${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ""}
    </div>
    <div class="col gap-2" id="options"></div>
    <div class="row">
      <button class="btn-secondary" id="back-btn">Zur\ück</button>
      <button class="btn-primary flex-1" id="next-btn">${state.step === total - 1 ? "Ergebnis anzeigen" : "Weiter"}</button>
    </div>
  `;

  const optionsWrap = div.querySelector("#options");
  q.options.forEach((opt) => {
    const btn = document.createElement("button");
    const selected = q.multi
      ? state.answers[q.id].includes(opt.id)
      : state.answers[q.id] === opt.id;
    btn.className = "option" + (selected ? " selected" : "");
    btn.innerHTML = `<span>${esc(opt.label)}</span>` + (selected ? `<span class="dash">&mdash;</span>` : "");
    btn.addEventListener("click", () => {
      if (q.multi) {
        toggleMulti(q.id, opt.id);
      } else {
        state.answers[q.id] = opt.id;
      }
      render();
    });
    optionsWrap.appendChild(btn);
  });

  container.innerHTML = "";
  container.appendChild(div);

  const nextBtn = div.querySelector("#next-btn");
  nextBtn.disabled = !isAnswered(q);
  nextBtn.addEventListener("click", () => {
    if (!isAnswered(q)) return;
    if (state.step < total - 1) {
      state.step += 1;
    } else {
      state.stage = "email";
    }
    render();
  });

  div.querySelector("#back-btn").addEventListener("click", () => {
    if (state.step > 0) {
      state.step -= 1;
    } else {
      state.stage = "start";
    }
    render();
  });
}

function toggleMulti(qid, optionId) {
  const list = state.answers[qid];
  if (optionId === "keine") {
    state.answers[qid] = list.includes("keine") ? [] : ["keine"];
    return;
  }
  if (list.includes(optionId)) {
    state.answers[qid] = list.filter((x) => x !== optionId);
  } else {
    state.answers[qid] = [...list.filter((x) => x !== "keine"), optionId];
  }
}

function renderEmail(container) {
  var d = document.createElement("div");
  d.className = "col gap-5";
  d.innerHTML = `
    <div class="col gap-2">
      <p class="progress-label">Fast geschafft</p>
      <h2 class="qtitle">Wohin darf ich dein Ergebnis schicken?</h2>
      <p class="hint">
        Du siehst es gleich hier auf dem Bildschirm. Zusätzlich schicke ich es
        dir per Mail, damit du es in Ruhe nachlesen kannst.
      </p>
    </div>

    <div class="feld">
      <label for="feld-vorname">Dein Vorname</label>
      <input id="feld-vorname" type="text" autocomplete="given-name" value="${esc(kontakt.vorname)}">
    </div>

    <div class="feld">
      <label for="feld-email">Deine E-Mail-Adresse</label>
      <input id="feld-email" type="email" autocomplete="email" inputmode="email" value="${esc(kontakt.email)}">
    </div>

    <div class="honigtopf">
      <label for="feld-webseite">Website</label>
      <input id="feld-webseite" type="text" tabindex="-1" autocomplete="off">
    </div>

    <label class="zustimmung" for="feld-einwilligung">
      <input id="feld-einwilligung" type="checkbox" ${kontakt.einwilligung ? "checked" : ""}>
      <span>
        Ja, schick mir mein Ergebnis und ab und zu Fütterungswissen per Mail.
        Ich kann mich jederzeit wieder abmelden.
        <a href="/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
      </span>
    </label>

    ${kontakt.fehler ? `<p class="fehler">${esc(kontakt.fehler)}</p>` : ""}

    <button class="btn-primary" id="senden-btn">
      ${kontakt.laeuft ? "Einen Moment ..." : "Ergebnis anzeigen"}
    </button>

    <button class="btn-secondary" id="back-btn">Zurück</button>

    <p class="kleingedrucktes">
      Deine Adresse bekommt nur Yasi. Sie wird nicht weitergegeben und nicht
      verkauft.
    </p>
  `;

  container.innerHTML = "";
  container.appendChild(d);

  var vornameFeld = d.querySelector("#feld-vorname");
  var emailFeld = d.querySelector("#feld-email");
  var einwilligungFeld = d.querySelector("#feld-einwilligung");
  var webseiteFeld = d.querySelector("#feld-webseite");
  var sendenBtn = d.querySelector("#senden-btn");

  sendenBtn.disabled = kontakt.laeuft;

  // Der Zustand wird beim Tippen mitgeschrieben, damit nach einer Fehlermeldung
  // nicht alles noch einmal eingetippt werden muss.
  vornameFeld.addEventListener("input", function () {
    kontakt.vorname = vornameFeld.value;
  });
  emailFeld.addEventListener("input", function () {
    kontakt.email = emailFeld.value;
  });
  einwilligungFeld.addEventListener("change", function () {
    kontakt.einwilligung = einwilligungFeld.checked;
  });

  d.querySelector("#back-btn").addEventListener("click", function () {
    state.stage = "quiz";
    state.step = QUESTIONS.length - 1;
    render();
  });

  sendenBtn.addEventListener("click", function () {
    if (kontakt.laeuft) return;

    kontakt.vorname = vornameFeld.value.trim();
    kontakt.email = emailFeld.value.trim();
    kontakt.einwilligung = einwilligungFeld.checked;

    if (kontakt.vorname.length < 2) {
      kontakt.fehler = "Bitte trag deinen Vornamen ein.";
      render();
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(kontakt.email)) {
      kontakt.fehler = "Diese E-Mail-Adresse sieht nicht vollständig aus.";
      render();
      return;
    }
    if (!kontakt.einwilligung) {
      kontakt.fehler = "Ohne dein Häkchen darf ich dir leider nichts schicken.";
      render();
      return;
    }

    var typeKey = computeResult(state.answers);
    var type = TYPES[typeKey];

    kontakt.fehler = "";
    kontakt.laeuft = true;
    render();

    fetch("/api/futter-check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        vorname: kontakt.vorname,
        email: kontakt.email,
        webseite: webseiteFeld ? webseiteFeld.value : "",
        ergebnisTitel: type.title,
        ergebnisText: type.text(state.answers),
        antworten: state.answers,
      }),
    })
      .then(function (res) {
        return res.json().catch(function () {
          return { ok: false };
        });
      })
      .then(function (antwort) {
        kontakt.laeuft = false;
        if (antwort && antwort.ok) {
          state.stage = "result";
          kontakt.fehler = "";
        } else {
          kontakt.fehler =
            (antwort && antwort.fehler) ||
            "Das hat gerade nicht geklappt. Versuch es bitte noch einmal.";
          // Kein Nachhausegehen mit leeren Händen: wenn bei mir etwas
          // schiefläuft, soll sie ihr Ergebnis trotzdem sehen dürfen.
          kontakt.notausgang = true;
        }
        render();
      })
      .catch(function () {
        kontakt.laeuft = false;
        kontakt.fehler =
          "Ich konnte dich gerade nicht erreichen. Prüf kurz deine Verbindung und versuch es noch einmal.";
        kontakt.notausgang = true;
        render();
      });
  });

  // Erscheint erst, wenn wirklich etwas schiefgegangen ist.
  if (kontakt.notausgang) {
    var notausgang = document.createElement("button");
    notausgang.className = "restart-link";
    notausgang.textContent = "Ergebnis trotzdem ansehen";
    notausgang.addEventListener("click", function () {
      state.stage = "result";
      render();
    });
    d.appendChild(notausgang);
  }
}

function renderResult(container) {
  const typeKey = computeResult(state.answers);
  const type = TYPES[typeKey];
  const hinweis = altersHinweis(state.answers.alter);

  container.innerHTML = `
    <div class="col gap-5">
      <div class="card col gap-4">
        <div class="col gap-2">
          <p class="result-kicker">${esc(type.kicker)}</p>
          <p class="result-title">${esc(type.title)}</p>
          <div class="result-rule"></div>
        </div>
        <p>${esc(type.text(state.answers))}</p>
        ${hinweis ? `<p class="alter-note">${esc(hinweis)}</p>` : ""}
        <div class="callout"><p>${esc(type.step)}</p></div>
      </div>
      ${
        kontakt.email && !kontakt.notausgang
          ? `<div class="card col gap-2">
              <p class="result-kicker">Noch ein Klick</p>
              <p>
                Ich habe dir gerade eine Mail geschickt, in der du kurz
                bestätigst, dass du das bist. Erst danach darf ich dir dein
                Ergebnis schicken. Schau auch im Spam-Ordner nach.
              </p>
            </div>`
          : ""
      }
      <div class="card-cta col gap-4">
        <p class="cta-text">
          Dein F\ütterungstyp zeigt dir, wo die gr\ö\ßte L\ücke bei deinem Pferd
          liegt. Wenn du die Mineralversorgung deines Pferdes ganzheitlich
          und individuell verstehen und gezielt schlie\ßen m\öchtest, ist genau
          das dein n\ächster Schritt im Mineralfinder Kurs.
        </p>
        <a class="cta-btn" href="/mineral-klarheit">Mineral-Klarheit ansehen</a>
      </div>
      <button class="restart-link" id="restart-btn">Check noch einmal durchlaufen</button>
      <p class="signature" style="text-align:center;">Alles Gute f\ür dich und dein Pferd, Yasi von Pferdeliebehealthy</p>
    </div>
  `;

  container.querySelector("#restart-btn").addEventListener("click", () => {
    kontakt = {
      vorname: "",
      email: "",
      einwilligung: false,
      laeuft: false,
      fehler: "",
    };
    state = {
      stage: "start",
      step: 0,
      answers: {
        alter: null,
        grundfuetterung: null,
        mineralstatus: null,
        aﾮlligkeiten: [],
        selbstbild: null,
      },
    };
    render();
  });
}

render();
</script>
</body>
</html>
